<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NewAl Code</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><span class="logo" aria-hidden="true"></span><span>NewAl Code</span></div>
    <nav class="side-top">
      <button id="new-thread" class="side-item"><i data-icon="edit"></i><span>New thread</span><kbd>Ctrl N</kbd></button>
      <button id="open-models" class="side-item"><i data-icon="cube"></i><span>Models</span></button>
      <button id="open-extensions" class="side-item"><i data-icon="spark"></i><span>Skills, agents &amp; MCP</span></button>
      <button id="open-cloud" class="side-item"><i data-icon="cloud"></i><span>Cloud tasks</span></button>
      <button id="open-github" class="side-item"><i data-icon="git"></i><span>GitHub</span></button>
      <button id="open-phone" class="side-item" hidden><i data-icon="phone"></i><span>This phone: Termux, screen, files</span></button>
    </nav>
    <div class="side-section"><span>Threads</span><button id="clone-repo" class="mini-btn" title="Clone from GitHub"><i data-icon="download"></i></button><button id="open-folder" class="mini-btn" title="Open a project folder"><i data-icon="folder-plus"></i></button></div>
    <div id="projects" class="projects"></div>
    <div class="side-bottom">
      <button id="open-settings" class="side-item"><i data-icon="gear"></i><span>Settings</span></button>
      <div id="hw" class="hw"></div>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button id="toggle-sidebar" class="icon-btn" title="Sidebar"><i data-icon="sidebar"></i></button>
      <div class="title-wrap">
        <span id="thread-title">New thread</span>
        <span id="project-chip" class="chip" hidden></span>
        <span id="branch-chip" class="chip" hidden></span>
      </div>
      <div class="top-actions">
        <div class="picker up-right down" id="open-picker"><button type="button" class="btn picker-btn-plain" title="Open the folder"><i data-icon="folder"></i><span>Open</span><i data-icon="chevron"></i></button><div class="menu"></div></div>
        <button id="btn-commit" class="btn" hidden><i data-icon="commit"></i><span>Commit</span></button>
        <button id="toggle-terminal" class="icon-btn" title="Terminal (Ctrl `)"><i data-icon="terminal"></i></button>
        <button id="toggle-review" class="btn review-btn" title="Review changes"><i data-icon="diff"></i><span id="changes-count">0</span></button>
      </div>
    </header>

    <div id="center">
      <section id="thread">
        <div id="messages"></div>
        <div id="empty" class="empty">
          <div class="empty-logo"></div>
          <h1 id="empty-title">What should we build?</h1>
          <p id="empty-sub">Open a project folder, then describe the change. NewAl Code reads, edits, runs and checks it.</p>
          <div id="suggestions" class="suggestions"></div>
        </div>
      </section>

      <section id="composer-wrap">
        <div id="approvals"></div>
        <div id="todo-pin" hidden></div>
        <form id="composer" autocomplete="off">
          <div id="attachments" hidden></div>
          <textarea id="input" dir="auto" rows="1" placeholder="Ask NewAl Code anything. @ to add files, / for commands"></textarea>
          <div id="popup" class="popup" hidden></div>
          <div class="composer-bar">
            <div class="left">
              <button type="button" id="attach" class="icon-btn round" title="Attach an image"><i data-icon="plus"></i></button>
              <div class="picker" id="model-picker"><button type="button" class="picker-btn"><i data-icon="cube"></i><span class="label">auto</span><i data-icon="chevron"></i></button><div class="menu"></div></div>
              <div class="picker" id="reasoning-picker"><button type="button" class="picker-btn"><i data-icon="brain"></i><span class="label">Auto</span><i data-icon="chevron"></i></button><div class="menu"></div></div>
            </div>
            <div class="right">
              <div class="picker up-right" id="mode-picker"><button type="button" class="picker-btn"><i data-icon="shield"></i><span class="label">Agent</span><i data-icon="chevron"></i></button><div class="menu"></div></div>
              <button type="button" id="mic" class="icon-btn round" title="Speak your request" hidden><i data-icon="mic"></i></button>
              <button type="submit" id="send" class="send-btn" title="Send (Enter)"><i data-icon="arrow-up"></i></button>
            </div>
          </div>
          <input type="file" id="file-input" accept="image/*" multiple hidden>
        </form>
        <div class="composer-foot">
          <div class="picker" id="env-picker"><button type="button" class="picker-btn small" title="Where a new thread works"><i data-icon="laptop"></i><span class="label">Local</span><i data-icon="chevron"></i></button><div class="menu"></div></div>
          <span id="sandbox-chip" class="foot-chip" title="Commands can write only inside the project" hidden><i data-icon="shield"></i><span>Sandboxed</span></span>
          <button type="button" id="access-chip" class="foot-chip access" title="Full access: NewAl Code works without the sandbox and without asking (catastrophic commands are still refused). Click to change." hidden><i data-icon="shield"></i><span>Full access</span></button>
          <span id="ctx-meter" class="foot-chip" hidden></span>
          <span id="speed" class="foot-chip" hidden></span>
          <span id="goal-chip" class="foot-chip goal" hidden></span>
        </div>
      </section>

      <section id="terminal" hidden>
        <div class="term-head"><span><i data-icon="terminal"></i> Terminal</span><select id="term-shell" title="The shell" hidden></select><button id="term-ext" class="mini-btn" title="Open a terminal window here, with NewAl Code">⧉</button><button id="term-clear" class="mini-btn" title="Clear">⌫</button><button id="term-close" class="mini-btn" title="Close">×</button></div>
        <pre id="term-out"></pre>
        <form id="term-form"><span class="prompt" id="term-prompt">$</span><input id="term-input" placeholder="Run a command in the project" autocomplete="off"></form>
      </section>
    </div>
  </main>

  <aside id="review" hidden>
    <header class="review-head">
      <span class="review-title">Review</span>
      <span id="review-stats" class="muted"></span>
      <span class="spacer"></span>
      <button id="review-apply" class="btn small primary" title="Apply this worktree's changes to the project" hidden>Apply to project</button>
      <button id="review-discard" class="btn small danger" title="Delete this thread's worktree and branch" hidden>Discard worktree</button>
      <button id="review-undo" class="btn small" title="Revert the last turn's changes">Undo last turn</button>
      <button id="review-close" class="icon-btn" title="Close">×</button>
    </header>
    <div id="review-files"></div>
    <div id="review-diff"></div>
    <form id="commit-form" hidden>
      <input id="commit-msg" placeholder="Commit message">
      <select id="commit-then" title="After the commit">
        <option value="">Commit</option>
        <option value="push">Commit and push</option>
        <option value="pr">Commit and create PR</option>
      </select>
      <button class="btn primary" type="submit">Go</button>
    </form>
  </aside>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-card">
    <header><span id="modal-title"></span><button id="modal-close" class="icon-btn">×</button></header>
    <div id="modal-body"></div>
  </div>
</div>
<div id="toast" hidden></div>

<script src="markdown.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
