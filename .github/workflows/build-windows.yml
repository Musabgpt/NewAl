name: Build NewAl for Windows

on:
  push:
    branches: [ claude/newal-desktop ]
    paths: [ "desktop/**", ".github/workflows/build-windows.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: python -m pip install --upgrade pip pyinstaller pywebview pypdf numpy truststore certifi

      - name: Python checks
        run: |
          python -m compileall -q newal
          python -m unittest discover -s tests -v

      - name: Download llama.cpp (Windows CPU build) and rclone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          # The newest release that ships a Windows x64 CPU build (not every release has one).
          $rels = Invoke-RestMethod -Uri "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=30" -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "NewAl" }
          $rel = $null; $asset = $null
          foreach ($r in $rels) {
            $a = $r.assets | Where-Object { $_.name -match "win" -and $_.name -match "cpu" -and $_.name -match "x64" -and $_.name -match "\.zip$" } | Select-Object -First 1
            if ($a) { $rel = $r; $asset = $a; break }
          }
          if (-not $asset) {
            $rels | Select-Object -First 3 | ForEach-Object { Write-Host "$($_.tag_name): $(($_.assets | ForEach-Object name) -join ', ')" }
            throw "no Windows CPU build found in the llama.cpp releases"
          }
          Write-Host "llama.cpp $($rel.tag_name): $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile llama.zip
          Expand-Archive llama.zip -DestinationPath llama -Force
          New-Item -ItemType Directory -Force bin | Out-Null
          # llama-server.exe and every DLL it needs (ggml, llama, the per-CPU backends).
          Get-ChildItem llama -Recurse -Include *.dll, llama-server.exe | Copy-Item -Destination bin
          Invoke-WebRequest "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile rclone.zip
          Expand-Archive rclone.zip -DestinationPath rclone -Force
          Get-ChildItem rclone -Recurse -Filter rclone.exe | Copy-Item -Destination bin
          Set-Content bin/llama-cpp-version.txt $rel.tag_name
          # Git Credential Manager (standalone): one-click GitHub/GitLab sign-in even without Git installed.
          $gcmRel = Invoke-RestMethod -Uri "https://api.github.com/repos/git-ecosystem/git-credential-manager/releases/latest" -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "NewAl" }
          $gcmAsset = $gcmRel.assets | Where-Object { $_.name -match "^gcm-win-x86-.*\.zip$" -and $_.name -notmatch "symbols" } | Select-Object -First 1
          if (-not $gcmAsset) { $gcmRel.assets | ForEach-Object { Write-Host $_.name }; throw "no GCM Windows zip" }
          Write-Host "GCM $($gcmRel.tag_name): $($gcmAsset.name)"
          Invoke-WebRequest $gcmAsset.browser_download_url -OutFile gcm.zip
          Expand-Archive gcm.zip -DestinationPath gcmx -Force
          $exe = Get-ChildItem gcmx -Recurse -Filter git-credential-manager.exe | Select-Object -First 1
          if ($exe) { New-Item -ItemType Directory -Force bin/gcm | Out-Null; Copy-Item "$($exe.DirectoryName)/*" bin/gcm -Recurse -Force }
          if (-not (Test-Path bin/gcm/git-credential-manager.exe)) { Get-ChildItem gcmx -Recurse | Select-Object -First 30 FullName; throw "git-credential-manager.exe missing" }
          # Visual C++ runtime next to llama-server (app-local deployment): many PCs do not have the
          # VC++ Redistributable installed, and without it the engine cannot start.
          foreach ($dll in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll",
                           "msvcp140_atomic_wait.dll", "msvcp140_codecvt_ids.dll", "concrt140.dll", "vcomp140.dll") {
            $src = Join-Path $env:SystemRoot "System32\$dll"
            if (Test-Path $src) { Copy-Item $src bin -Force }
          }
          # Python for testing generated code on PCs without Python (the official embeddable build + pip).
          $py = "3.12.10"
          Invoke-WebRequest "https://www.python.org/ftp/python/$py/python-$py-embed-amd64.zip" -OutFile pyembed.zip
          Expand-Archive pyembed.zip -DestinationPath bin/python -Force
          $pth = Get-ChildItem bin/python -Filter "python*._pth" | Select-Object -First 1
          (Get-Content $pth.FullName) -replace "^#\s*import site", "import site" | Set-Content $pth.FullName
          Invoke-WebRequest "https://bootstrap.pypa.io/get-pip.py" -OutFile get-pip.py
          bin/python/python.exe get-pip.py --no-warn-script-location -q
          bin/python/python.exe -m pip --version
          # The embeddable build has no tkinter: copy it from the full Python so GUI programs (calculators,
          # small tools) can be tested and built.
          $base = python -c "import sys; print(sys.base_prefix)"
          Copy-Item "$base/DLLs/_tkinter.pyd", "$base/DLLs/tcl86t.dll", "$base/DLLs/tk86t.dll" bin/python -Force
          Copy-Item "$base/Lib/tkinter" bin/python/tkinter -Recurse -Force
          Copy-Item "$base/tcl" bin/python/tcl -Recurse -Force
          bin/python/python.exe -c "import json, sqlite3, urllib.request, tkinter; print('bundled python ok, tk', tkinter.TkVersion)"
          Get-ChildItem bin | Format-Table Name, Length

      - name: Check every DLL the engine needs is shipped or part of Windows
        run: |
          python -m pip install -q pefile
          python tools/check_dlls.py bin

      - name: Check the engine runs a model
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest "https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf" -OutFile tiny.gguf
          $p = Start-Process bin/llama-server.exe -ArgumentList "-m tiny.gguf --port 18090 -c 256 --no-webui" -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep 1
            try { $ok = (Invoke-WebRequest http://127.0.0.1:18090/health -UseBasicParsing).StatusCode -eq 200 } catch {}
          }
          $r = Invoke-RestMethod http://127.0.0.1:18090/completion -Method Post -ContentType "application/json" -Body '{"prompt":"Once upon a time","n_predict":16}'
          Write-Host "engine output: $($r.content)"
          Stop-Process -Id $p.Id -Force
          if (-not $ok -or -not $r.content) { throw "llama-server did not answer" }

      - name: Build NewAl.exe
        run: |
          pyinstaller --noconfirm --windowed --name NewAl --icon assets/newal.ico `
            --add-data "newal/ui;ui" --add-data "newal/skills;skills" --add-data "assets;assets" `
            --collect-submodules newal --collect-data certifi --hidden-import truststore NewAl.py
          Copy-Item -Recurse bin dist/NewAl/bin

      - name: Check the built app
        run: |
          $p = Start-Process dist/NewAl/NewAl.exe -ArgumentList "--smoke smoke.json tiny.gguf" -Wait -PassThru
          Get-Content smoke.json -ErrorAction SilentlyContinue | Select-Object -First 40
          if ($p.ExitCode -ne 0) { throw "smoke test failed ($($p.ExitCode))" }

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc installer.iss
          Compress-Archive -Path dist/NewAl/* -DestinationPath dist/NewAl-portable.zip

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NewAl-Windows-Setup
          path: desktop/dist/NewAl-Setup.exe
          compression-level: 0
          retention-days: 14

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: NewAl-Windows-Portable
          path: desktop/dist/NewAl-portable.zip
          compression-level: 0
          retention-days: 14
