# NewAl Code cloud tasks. `newal-code cloud "a task"` (or Cloud in the app) pushes a branch newal-cloud/<id> with
# .newal/cloud/task.json; this workflow does the task on the runner and uploads the result for NewAl Code to show,
# apply or turn into a pull request. API models use the repository secrets below when they are set; without one,
# the task runs a local model on the runner's CPU (downloaded once, then cached).
name: NewAl Code cloud task
run-name: "NewAl Code cloud: ${{ github.ref_name }}"

on:
  push:
    branches: [ "newal-cloud/**", "ccr-e40af0a0-eec37q" ]
    paths: [ ".newal/cloud/task.json" ]          # (a push that removes it runs nothing)

permissions:
  contents: write

jobs:
  task:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: NewAl Code
        if: hashFiles('.newal/cloud/task.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PIN: ${{ vars.NEWAL_CODE_RELEASE }}
        run: |
          set -e
          tag="$PIN"
          if [ -z "$tag" ]; then
            tag=$(gh release list -R Musabgpt/NewAl --limit 60 --json tagName --jq '.[].tagName' | grep '^newal-code-b' | head -1)
          fi
          echo "NewAl Code $tag"
          gh release download "$tag" -R Musabgpt/NewAl -p NewAlCode-linux-x64.tar.gz -D "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/NewAlCode-linux-x64.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/NewAlCode" >> "$GITHUB_PATH"

      - name: Model
        id: model
        if: hashFiles('.newal/cloud/task.json') != ''
        run: echo "id=$(python3 -c "import json; print(json.load(open('.newal/cloud/task.json')).get('model') or 'auto')")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        if: hashFiles('.newal/cloud/task.json') != ''
        with:
          path: ~/.newal-code/models
          key: newal-code-model-${{ steps.model.outputs.id }}

      - name: The task
        if: hashFiles('.newal/cloud/task.json') != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: newal-code cloud run --out "$RUNNER_TEMP/newal-cloud-result"

      - uses: actions/upload-artifact@v4
        if: always() && steps.model.outcome == 'success'
        with:
          name: newal-cloud-result
          path: ${{ runner.temp }}/newal-cloud-result
          retention-days: 30
