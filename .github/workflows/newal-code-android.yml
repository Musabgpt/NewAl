name: NewAl Code Lite for Android

# Builds NewAl Code Lite (android-lite/): python.org's Python for Android with a small launcher, llama-server built
# for phones, NewAl Code itself; then runs it in Android emulators the size of a 3 GB and a 2 GB phone, where the
# agent downloads the model the phone's RAM gets, writes a Python file and runs it (android-lite/tests/phone_test.py).
on:
  push:
    branches: [ claude/newal-desktop, ccr-e40af0a0-eec37q ]
    paths:
      - "android-lite/**"
      - "desktop/newal_code/**"
      - ".github/workflows/newal-code-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:                          # a newer push waits: a phone check already running is not thrown away
  group: newal-code-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK and NDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME" -type f -name sdkmanager | sort | tail -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" > /dev/null
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Python, llama.cpp and NewAl Code for Android
        run: android-lite/native/prepare.sh arm64-v8a x86_64

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build the APK
        env:
          NEWAL_BUILD: ${{ github.run_number }}
        run: |
          gradle -p android-lite :app:assembleRelease --stacktrace
          cp android-lite/app/build/outputs/apk/release/app-release.apk NewAlCodeLite.apk
          ls -la NewAlCodeLite.apk
          unzip -l NewAlCodeLite.apk | grep -E "lib/|assets/" | head -40

      - uses: actions/upload-artifact@v4
        with:
          name: NewAlCodeLite-apk
          path: NewAlCodeLite.apk
          compression-level: 0
          retention-days: 14

  phone:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          # The 3 GB phone also checks the phone features: git, screen control, Termux, a GGUF from the phone's
          # storage (see phone_test.py). Android 15 draws apps under the system bars: its check is the layout.
          - { ram: 3072, label: "3 GB phone", extra: "--features", api: 30 }
          - { ram: 2048, label: "2 GB phone", extra: "", api: 30 }
          - { ram: 4096, label: "Android 15 layout", extra: "--layout-only", api: 35 }
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: NewAlCodeLite-apk

      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: NewAl Code Lite on a ${{ matrix.label }}
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 80
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 10
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          ram-size: ${{ matrix.ram }}M
          disk-size: 6000M
          cores: 4
          emulator-options: -no-window -no-snapshot-save -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 android-lite/tests/phone_test.py NewAlCodeLite.apk "${{ matrix.label }}" ${{ matrix.extra }}

  release:
    needs: [apk, phone]
    if: ${{ !cancelled() && needs.apk.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: NewAlCodeLite-apk

      - name: Publish (pre-release)
        env:
          GH_TOKEN: ${{ github.token }}
          PHONES: ${{ needs.phone.result }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          N: ${{ github.run_number }}
        run: |
          tag="newal-code-lite-b$N"
          printf '%s\n' \
            "NewAl Code Lite for Android phones with 2-4 GB of RAM (Android 8 and up; arm64, and x86_64 for emulators)." \
            "" \
            "Install NewAlCodeLite.apk (allow installing from this source), open it, and download the model it" \
            "recommends for the phone's RAM (Qwen3.5 0.8B for 2-3 GB, 2B for 4 GB). The agent, its Python and the" \
            "model all run on the phone." \
            "" \
            "Emulator check of this build (2 GB and 3 GB phones): $PHONES." > notes.md
          # Since build 2 GitHub has answered this workflow's release (a new tag on the commit) with 403, where the
          # desktop workflow's release of the same commit went through. So: the tag first, by git (whose refusal
          # says why), then the release through the API, printing GitHub's answer (with the permission it wants)
          # when it is refused.
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            git push origin "HEAD:refs/tags/$tag" || echo "::warning::git could not push the tag"
          fi
          for attempt in 1 2 3; do
            if gh release view "$tag" --repo "$REPO" > /dev/null 2>&1; then
              gh release upload "$tag" NewAlCodeLite.apk --clobber --repo "$REPO" && exit 0
            elif gh api -i -X POST "repos/$REPO/releases" -f tag_name="$tag" -f target_commitish="$SHA" \
                -f name="NewAl Code Lite build $N" -F body=@notes.md -F prerelease=true -f make_latest=false \
                > answer.txt 2>&1; then
              gh release upload "$tag" NewAlCodeLite.apk --clobber --repo "$REPO" && exit 0
            else
              echo "attempt $attempt: GitHub answered"
              grep -iE "^HTTP|x-accepted-github-permissions|x-github-request-id|\"message\"|documentation" answer.txt || cat answer.txt
            fi
            sleep $((attempt * 30))
          done
          exit 1
